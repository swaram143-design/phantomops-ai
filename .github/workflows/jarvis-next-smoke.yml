name: JARVIS-NEXT Smoke Test

# Smoke workflow for the jarvis-next runtime contract suite.
on:
  workflow_dispatch:
  push:
    branches: [jarvis-next]
    paths:
      - "jarvis_next/**"
      - ".github/workflows/jarvis-next-smoke.yml"
  pull_request:
    branches: [jarvis-next]
    paths:
      - "jarvis_next/**"
      - ".github/workflows/jarvis-next-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python and package import
        run: |
          python --version
          python -c "import jarvis_next; print('jarvis_next', jarvis_next.__version__)"
      - name: Run JARVIS-NEXT smoke test
        run: python -m jarvis_next.smoke_test
      - name: Run bootstrap contract test
        run: python -m jarvis_next.bootstrap_contract_test
      - name: Run ecosystem registry contract test
        run: python -m jarvis_next.ecosystem_registry_test
      - name: Run OpenHands adapter contract test
        run: python -m jarvis_next.openhands_adapter_contract_test
      - name: Run NEXUS contract test
        run: python -m jarvis_next.nexus_contract_test
      - name: Run NEXUS route compatibility test
        run: python -m jarvis_next.nexus_route_contract_test
      - name: Run revenue chain contract test
        run: python -m jarvis_next.revenue_chain_test
      - name: Run planner policy test
        run: python -m jarvis_next.planner_policy_test
      - name: Run planner side-effect contract test
        run: python -m jarvis_next.planner_side_effect_contract_test
      - name: Run planner invalid-model fallback contract test
        run: python -m jarvis_next.planner_fallback_contract_test
      - name: Run planner failure persistence contract test
        run: python -m jarvis_next.planner_failure_contract_test
      - name: Run runtime permission gate contract test
        run: python -m jarvis_next.runtime_permission_gate_test
      - name: Run approval rejection contract test
        run: python -m jarvis_next.approval_rejection_contract_test
      - name: Run approval deduplication contract test
        run: python -m jarvis_next.approval_deduplication_contract_test
      - name: Run approval concurrency contract test
        run: python -m jarvis_next.approval_concurrency_contract_test
      - name: Run approval resolution concurrency contract test
        run: python -m jarvis_next.approval_resolution_concurrency_contract_test
      - name: Run result verifier contract test
        run: python -m jarvis_next.result_verifier_contract_test
      - name: Run durable completed-mission resume contract test
        run: python -m jarvis_next.runtime_resume_contract_test
      - name: Run concurrent mission resume contract test
        run: python -m jarvis_next.runtime_resume_concurrency_contract_test
      - name: Run runtime worker fallback contract test
        run: python -m jarvis_next.runtime_fallback_contract_test
      - name: Run durable restart resume contract test
        run: python -m jarvis_next.runtime_restart_resume_contract_test
      - name: Run partial mission resume idempotency contract test
        run: python -m jarvis_next.runtime_partial_resume_contract_test
      - name: Run retry exhaustion contract test
        run: python -m jarvis_next.runtime_retry_exhaustion_contract_test
      - name: Run terminal mission resume idempotency contract test
        run: python -m jarvis_next.runtime_terminal_resume_contract_test
      - name: Run blocked mission resume contract test
        run: python -m jarvis_next.runtime_blocked_resume_contract_test
      - name: Run mission recipe contract test
        run: python -m jarvis_next.mission_recipes_test
      - name: Run durable revenue approval resume test
        run: python -m jarvis_next.revenue_runtime_test
      - name: Run real adapter integration test
        run: python -m jarvis_next.real_adapter_integration_test
      - name: Run integration readiness contract test
        run: python -m jarvis_next.integration_readiness_test
