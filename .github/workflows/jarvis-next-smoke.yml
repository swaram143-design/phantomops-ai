name: JARVIS-NEXT Smoke Test

# Keep canonical jarvis-next validation runnable on direct branch pushes and manual dispatch.
# Validation includes strict idempotency for repeated uncertain-outcome reconciliation.
on:
  workflow_dispatch:
  push:
    branches: [jarvis-next]
    paths:
      - 'jarvis_next/**'
      - 'core/**'
      - '.github/workflows/jarvis-next-smoke.yml'
  pull_request:
    branches: [jarvis-next]
    paths:
      - 'jarvis_next/**'
      - 'core/**'
      - '.github/workflows/jarvis-next-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python and package import
        run: python --version && python -c "import jarvis_next; print('jarvis_next import ok')"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run GOVI Core facade contract test
        run: python -m jarvis_next.govi_core_contract_test
      - name: Run legacy orchestrator authority boundary contract test
        run: python -m jarvis_next.legacy_boundary_contract_test
      - name: Run legacy execution boundary contract test
        run: python -m jarvis_next.legacy_execution_boundary_contract_test
      - name: Run PhantomOps adapter boundary contract test
        run: python -m jarvis_next.phantomops_adapter_boundary_contract_test
      - name: Run JARVIS-NEXT smoke test
        run: python -m jarvis_next.smoke_test
      - name: Run state event atomicity contract test
        run: python -m jarvis_next.state_event_atomicity_contract_test
      - name: Run coupled step event atomicity contract test
        run: python -m jarvis_next.step_event_atomicity_contract_test
      - name: Run worker idempotency key contract test
        run: python -m jarvis_next.runtime_idempotency_key_contract_test
      - name: Run durable result serialization contract test
        run: python -m jarvis_next.runtime_result_serialization_contract_test
      - name: Run adapter idempotency propagation contract test
        run: python -m jarvis_next.adapter_idempotency_propagation_contract_test
      - name: Run worker health exception redaction contract test
        run: python -m jarvis_next.worker_health_redaction_contract_test
      - name: Run bootstrap contract test
        run: python -m jarvis_next.bootstrap_contract_test
      - name: Run ecosystem registry contract test
        run: python -m jarvis_next.ecosystem_registry_test
      - name: Run OpenHands adapter contract test
        run: python -m jarvis_next.openhands_adapter_contract_test
      - name: Run NEXUS contract test
        run: python -m jarvis_next.nexus_contract_test
      - name: Run NEXUS route compatibility test
        run: python -m jarvis_next.nexus_route_contract_test
      - name: Run revenue chain contract test
        run: python -m jarvis_next.revenue_chain_test
      - name: Run real PhantomOps revenue runtime contract
        run: python -m jarvis_next.phantomops_revenue_runtime_contract_test
      - name: Run planner policy test
        run: python -m jarvis_next.planner_policy_test
      - name: Run planner side-effect contract test
        run: python -m jarvis_next.planner_side_effect_contract_test
      - name: Run planner invalid-model fallback contract test
